<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traceability &amp; Flow of Work Practice Lab</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --text:#1d2330; --muted:#5d6678; --line:#e1e5ec;
  --accent:#0f6cbd; --accent-soft:#e6f0fa; --ok:#127a3c; --ok-soft:#e5f5eb; --bad:#b42318; --bad-soft:#fdecea;
  --warn:#a35200; --warn-soft:#fdf1e3;
  --code-bg:#0f1720; --code-text:#d6dde8;
  --k:#7cc4ff; --s:#f2b880; --c:#7d8a9c; --d:#d7a6ff; --n:#9fe3a8; --t:#6fd6c9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --panel:#161b22; --text:#e3e8ef; --muted:#9aa4b2; --line:#2a313c;
    --accent:#4ea1f3; --accent-soft:#16283c; --ok:#4cc27a; --ok-soft:#13281c; --bad:#ff7b72; --bad-soft:#2d1615;
    --warn:#f0b450; --warn-soft:#2b2112;
    --code-bg:#0a0d12;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --panel:#161b22; --text:#e3e8ef; --muted:#9aa4b2; --line:#2a313c;
  --accent:#4ea1f3; --accent-soft:#16283c; --ok:#4cc27a; --ok-soft:#13281c; --bad:#ff7b72; --bad-soft:#2d1615;
  --warn:#f0b450; --warn-soft:#2b2112;
  --code-bg:#0a0d12;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
code,pre,textarea{font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:18px;margin:0 8px 4px}
aside .sub{color:var(--muted);font-size:13px;margin:0 8px 14px}
.progress{height:6px;background:var(--line);border-radius:4px;margin:0 8px 6px;overflow:hidden}
.progress>div{height:100%;background:var(--ok);width:0;transition:width .3s}
.ptext{font-size:12px;color:var(--muted);margin:0 8px 14px}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--text);
  padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
nav button:hover{background:var(--accent-soft)}
nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .num{flex:0 0 24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted)}
nav button.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
nav .group{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 10px 4px}
.sidefoot{margin:18px 8px 0;display:grid;gap:10px;justify-items:start}
.sidefoot a{font-size:13px;color:var(--accent)}
.theme{font-size:13px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer}
main{padding:32px 40px 80px;max-width:980px;width:100%}
.tag{display:inline-block;font-size:12px;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:20px;margin-bottom:8px}
h2{font-size:28px;margin:0 0 8px}
h3{font-size:19px;margin:28px 0 8px}
p{margin:8px 0}
.lead{color:var(--muted);font-size:17px}
:not(pre)>code{background:var(--accent-soft);padding:1px 6px;border-radius:5px;font-size:.9em;overflow-wrap:anywhere}
.codewrap{position:relative;margin:12px 0}
pre{background:var(--code-bg);color:var(--code-text);padding:16px 18px;border-radius:10px;overflow:auto;font-size:14px;line-height:1.55;margin:0}
.file{font-size:12px;color:var(--muted);margin:12px 0 -6px;font-family:Consolas,monospace}
.copy{position:absolute;top:8px;right:8px;font-size:12px;background:#ffffff1a;color:#cfd8e3;border:0;border-radius:6px;padding:4px 9px;cursor:pointer}
.copy:hover{background:#ffffff33}
.tk{color:var(--k)} .ts{color:var(--s)} .tc{color:var(--c);font-style:italic} .td{color:var(--d)} .tn{color:var(--n)} .tt{color:var(--t)}
.tdash{color:var(--c)}
ul.tips,ol.tips{padding-left:20px} .tips li{margin:4px 0}
table.ref{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
table.ref th,table.ref td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.ref th{background:var(--accent-soft);font-weight:600}
.tablewrap{overflow-x:auto}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0;font-size:15px}
.note.exam{border-left-color:var(--warn);background:var(--warn-soft)}
.exercise{margin-top:30px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.exercise h3{margin-top:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.exercise h3 .kind{font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 10px}
.exercise h3 .badge{font-size:12px;background:var(--ok);color:#fff;border-radius:20px;padding:2px 10px;display:none}
.exercise.solved h3 .badge{display:inline-block}
.exercise.solved{border-color:var(--ok)}
textarea{width:100%;min-height:220px;background:var(--code-bg);color:var(--code-text);border:1px solid var(--line);border-radius:10px;
  padding:14px;font-size:14px;line-height:1.55;resize:vertical;tab-size:2;outline:none;white-space:pre;overflow:auto}
textarea.short{min-height:120px;white-space:pre-wrap}
textarea:focus{border-color:var(--accent)}
.edhelp{font-size:12px;color:var(--muted);margin:4px 0 0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.small{padding:2px 9px;font-size:13px}
.results{list-style:none;padding:0;margin:10px 0}
.results li{padding:6px 12px;border-radius:7px;margin:4px 0;font-size:14px}
.results li.pass{background:var(--ok-soft);color:var(--ok)}
.results li.fail{background:var(--bad-soft);color:var(--bad)}
.results li .sub{display:block;font-size:13px;margin:2px 0 0 18px;opacity:.9}
.hint{display:none;background:var(--accent-soft);padding:10px 14px;border-radius:8px;font-size:15px;margin:8px 0}
.why{display:none;border-left:3px solid var(--ok);background:var(--ok-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:15px}
.solution{display:none;margin:10px 0}
.solution .solhead{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 6px}
/* choice */
.opts{display:grid;gap:8px;margin:12px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:5px;flex:0 0 auto}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
/* order */
.order{list-style:none;padding:0;margin:12px 0;display:grid;gap:6px}
.order li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.order li .pos{flex:0 0 24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:600}
.order li .txt{flex:1}
.order li .mv{display:flex;gap:4px}
.order li.right{border-color:var(--ok);background:var(--ok-soft)}
.order li.wrong{border-color:var(--bad);background:var(--bad-soft)}
/* match */
.match{width:100%;border-collapse:collapse;margin:12px 0;font-size:15px}
.match td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:middle}
.match td:first-child{width:58%}
.match select{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px}
.match tr.right td{background:var(--ok-soft)}
.match tr.wrong td{background:var(--bad-soft)}
/* fill */
.fill{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0;line-height:2.3}
.fill.mono{font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;font-size:14px;white-space:pre-wrap;line-height:2.2}
.fill input{font:inherit;font-size:14px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);min-width:90px}
.fill input.right{border-color:var(--ok);background:var(--ok-soft)}
.fill input.wrong{border-color:var(--bad);background:var(--bad-soft)}
/* lines */
.lines{background:var(--code-bg);border-radius:10px;padding:8px 0;margin:12px 0;overflow:auto}
.lines .ln{display:flex;gap:12px;padding:2px 14px;cursor:pointer;color:var(--code-text);font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;font-size:14px;white-space:pre;border-left:3px solid transparent}
.lines .ln:hover{background:#ffffff12}
.lines .ln .no{color:var(--c);user-select:none;min-width:20px;text-align:right}
.lines .ln.sel{background:#f2b88026;border-left-color:var(--s)}
.lines .ln.right{background:#4cc27a2e;border-left-color:var(--n)}
.lines .ln.wrong{background:#ff7b7230;border-left-color:#ff7b72}
.lines.prose .ln{font-family:inherit;white-space:normal}
.navfoot{display:flex;justify-content:space-between;margin-top:30px}
.menu{display:none}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;inset:0 30% 0 0;z-index:5;transform:translateX(-105%);transition:transform .2s;height:100vh}
  aside.open{transform:none;box-shadow:0 0 40px #0006}
  main{padding:16px 16px 60px}
  .menu{display:inline-block;margin-bottom:12px}
  h2{font-size:23px}
  .match td{display:block;width:100% !important;border:0;padding:4px 6px}
  .match tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <h1>Flow of Work Lab</h1>
    <p class="sub">AZ-400 · 1.1 Traceability &amp; flow of work</p>
    <div class="progress"><div id="bar"></div></div>
    <p class="ptext" id="ptext"></p>
    <nav id="nav"></nav>
    <div class="sidefoot">
      <button class="theme" id="themeBtn">Toggle theme</button>
      <button class="theme" id="resetAllBtn">Reset progress</button>
      <a href="../azure-pipelines-tutorial/index.html">Open the Azure Pipelines Practice Lab</a>
      <a href="../bicep-tutorial/index.html">Open the Bicep Practice Lab</a>
    </div>
  </aside>
  <main>
    <button class="btn menu" id="menuBtn">☰ Modules</button>
    <div id="content"></div>
  </main>
</div>

<script>
/* ===================================================================
   MODULE DATA
   Exercise types (all share: id, title, q, hint, why):
     mc     options[], answer: index
     multi  options[], answer: [indexes]           (select all that apply)
     order  items[] in the CORRECT order (shown shuffled)
     match  rows: [[left html, correct choice]], choices[]
     fill   tpl with [[0]], [[1]]… blanks, blanks: [[accepted…]]  (first = shown in solution)
     lines  code: [lines], answer: [line indexes]  (click the faulty lines)
     text   lang: "yaml" | "text", starter, checks: [{l, t: api => bool}], solution
            yaml → api is the YAML query api (h, item, count, first, src)
            text → api is { src, lines }
   =================================================================== */
const KW = "(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)";   // GitHub closing keywords
const MODULES = [
/* ================================================================ 1 */
{
  group:"Structure the work",
  title:"GitHub Flow",
  tag:"branch · pull request · review · merge · deploy",
  intro:`<b>GitHub Flow</b> is a lightweight, branch-based workflow. There is <b>one long-lived branch</b> (<code>main</code>) that is always deployable. Every change, big or small, happens on a short-lived branch and comes back through a <b>pull request</b>, where review and automated checks act as the quality gate.`,
  sections:[
    {h:"The loop", lang:"text", code:`main ──●───────────────────────●──────────▶  always deployable
        \\                     /
         ●──●──●  feature/login-timeout
         │  │  │
         │  │  └ push → open PR → review + CI checks → merge → deploy → delete branch
         │  └ small, focused commits
         └ git switch -c feature/login-timeout`,
     p:`GitHub's own guide lists the steps as: <b>create a branch → make changes (commit, push) → create a pull request → address review comments → merge → delete the branch</b>. Teams practising continuous delivery deploy <code>main</code> right after the merge. (The original 2011 description also allowed deploying the branch to production <i>before</i> merging, to verify it; either way, <code>main</code> stays deployable.)`},
    {h:"GitHub Flow vs. other branching models", after:`<div class="tablewrap"><table class="ref">
<tr><th>Model</th><th>Long-lived branches</th><th>Fits when</th></tr>
<tr><td><b>GitHub Flow</b></td><td><code>main</code> only</td><td>Web apps / services that deploy continuously; one version in production</td></tr>
<tr><td><b>Trunk-based development</b></td><td><code>main</code> only, branches live hours (or commit to trunk directly), feature flags for unfinished work</td><td>Very high deployment frequency, strong CI</td></tr>
<tr><td><b>Git Flow</b></td><td><code>main</code> + <code>develop</code>, plus <code>release/*</code> and <code>hotfix/*</code></td><td>Scheduled releases, several versions supported at once</td></tr>
</table></div>`},
    {h:"Making it stick: protect main", p:`The flow is only a convention until you enforce it. Use <b>branch protection rules</b> or <b>repository rulesets</b> on <code>main</code>:`,
     lang:"text", code:`Require a pull request before merging
  └ Require approvals (e.g. 1 or 2)
  └ Dismiss stale approvals when new commits are pushed
  └ Require review from Code Owners
Require status checks to pass (your CI workflow)
Require conversation resolution before merging
Block force pushes · Restrict deletions`},
    {h:"Command line version", lang:"sh", code:`git switch -c fix/login-timeout          # 1 branch from an up-to-date main
git commit -am "Increase session timeout" # 2 small commits
git push -u origin fix/login-timeout      #   publish the branch, set upstream
gh pr create --fill --base main           # 3 open the pull request (GitHub CLI)
gh pr merge --squash --delete-branch      # 5 merge + delete the branch after review`}
  ],
  tip:`If a scenario says "one production version, deploy many times a day, keep it simple", the answer is <b>GitHub Flow</b> (or trunk-based). If it mentions <b>long-lived develop and release branches</b> or supporting several released versions, that's <b>Git Flow</b>. Enforcement of the flow = <b>branch protection / rulesets</b> with required reviews and status checks.`,
  exercises:[
    {id:"gf1", type:"order", title:"Put GitHub Flow in order",
     q:`Drag (or use the arrows) to put the steps of GitHub Flow in the right order.`,
     items:[
       "Create a descriptively named branch from main",
       "Commit small changes and push the branch",
       "Open a pull request against main",
       "Discuss, review and let the CI status checks run",
       "Merge the pull request into main",
       "Deploy main and delete the feature branch"
     ],
     hint:`Nothing reaches <code>main</code> without a pull request, and nothing is merged before it has been reviewed.`,
     why:`Branch → commit/push → pull request → review + checks → merge → deploy/clean up. The pull request is the centre of the flow: it is where discussion, review, CI results and (later) traceability links all live.`},
    {id:"gf2", type:"mc", title:"Pick the branching strategy",
     q:`A team runs a single SaaS web app. They deploy to production several times a day, have strong automated tests and want the simplest possible branching model where <code>main</code> is always releasable. Which strategy fits best?`,
     options:[
       "Git Flow with develop, release/* and hotfix/* branches",
       "GitHub Flow: short-lived branches merged into main through pull requests",
       "One long-lived branch per developer, merged monthly",
       "Release branches per sprint, with fixes cherry-picked back to main"
     ], answer:1,
     hint:`Look for "one production version" and "deploy many times a day".`,
     why:`GitHub Flow has one long-lived branch and short-lived topic branches, which matches continuous deployment of a single version. Git Flow adds develop/release branches that slow delivery down and only pay off with scheduled releases or multiple supported versions.`},
    {id:"gf3", type:"multi", title:"Enforce the flow on main",
     q:`Which settings in a branch protection rule (or ruleset) on <code>main</code> help enforce GitHub Flow? <i>Select all that apply.</i>`,
     options:[
       "Require a pull request before merging, with at least one approval",
       "Require status checks to pass before merging",
       "Allow force pushes for everyone",
       "Require review from Code Owners",
       "Allow deletions of the main branch",
       "Dismiss stale pull request approvals when new commits are pushed"
     ], answer:[0,1,3,5],
     hint:`Keep the settings that make the pull request a real gate. Drop the ones that let people bypass or destroy history.`,
     why:`Required pull requests, approvals, code-owner review, required status checks and dismissing stale approvals all make the PR the only path to <code>main</code>. Allowing force pushes or deletions does the opposite: it lets history be rewritten or the branch removed.`},
    {id:"gf4", type:"fill", title:"Complete the commands", mono:true,
     q:`Fill in the blanks so this terminal session follows GitHub Flow.`,
     tpl:`git [[0]] -c feature/cart-badge        # create and switch to a new branch
git commit -m "Show item count on cart icon"
git push [[1]] origin feature/cart-badge   # publish and set upstream
gh pr [[2]] --base main --fill            # open the pull request`,
     blanks:[["switch"],["-u","--set-upstream"],["create"]],
     hint:`Modern Git creates and switches to a branch with one command and <code>-c</code>. The GitHub CLI groups pull request commands under <code>gh pr</code>.`,
     why:`<code>git switch -c</code> creates the branch (the older equivalent is <code>git checkout -b</code>), <code>git push -u</code> publishes it and sets the upstream, and <code>gh pr create</code> opens the pull request.`},
    {id:"gf5", type:"lines", title:"Spot what breaks GitHub Flow", prose:true,
     q:`A team says they "do GitHub Flow". Click the <b>two</b> statements in their working agreement that contradict it.`,
     code:[
       "Every change starts on a new branch created from main.",
       "Branches are named after the work, for example fix/login-timeout.",
       "Finished features are merged into a long-lived develop branch and released from release/* branches each quarter.",
       "Every change to main goes through a pull request with at least one review.",
       "CI must pass before a pull request can be merged.",
       "Urgent hotfixes are pushed straight to main without a pull request.",
       "After merging, the branch is deleted and main is deployed."
     ], answer:[2,5],
     hint:`GitHub Flow has exactly one long-lived branch, and every change goes through a pull request. No exceptions.`,
     why:`A long-lived <code>develop</code> branch with quarterly <code>release/*</code> branches is Git Flow, not GitHub Flow. Pushing hotfixes directly to <code>main</code> skips the pull request, review and CI, so it breaks both the flow and its traceability. In GitHub Flow a hotfix is just another short-lived branch with a fast pull request.`}
  ]
},
/* ================================================================ 2 */
{
  group:"Azure Boards",
  title:"Processes & work item types",
  tag:"Basic · Agile · Scrum · CMMI · inheritance",
  intro:`Every Azure DevOps project uses a <b>process</b> that defines its work item types, fields, states and backlog levels. There are four system processes. They differ mainly in what the <b>requirement</b> level is called and which extra work item types they bring.`,
  sections:[
    {h:"The four system processes", after:`<div class="tablewrap"><table class="ref">
<tr><th>Process</th><th>Hierarchy (portfolio → requirement → task)</th><th>Extra types</th><th>Requirement states</th><th>Sizing field</th></tr>
<tr><td><b>Basic</b></td><td>Epic → <b>Issue</b> → Task</td><td>(no separate Bug type)</td><td>To Do, Doing, Done</td><td>Effort</td></tr>
<tr><td><b>Agile</b></td><td>Epic → Feature → <b>User Story</b> → Task</td><td>Bug, Issue</td><td>New, Active, Resolved, Closed, Removed</td><td>Story Points</td></tr>
<tr><td><b>Scrum</b></td><td>Epic → Feature → <b>Product Backlog Item</b> → Task</td><td>Bug, Impediment</td><td>New, Approved, Committed, Done, Removed</td><td>Effort</td></tr>
<tr><td><b>CMMI</b></td><td>Epic → Feature → <b>Requirement</b> → Task</td><td>Bug, Change Request, Issue, Review, Risk</td><td>Proposed, Active, Resolved, Closed</td><td>Size</td></tr>
</table></div>
<p>Tasks in Agile and CMMI track <b>Original Estimate, Remaining Work and Completed Work</b>. Scrum tasks track only <b>Remaining Work</b>. All processes also include the test types (Test Plan, Test Suite, Test Case, Shared Steps, Shared Parameter).</p>`},
    {h:"Choosing one", lang:"text", code:`Small team, wants the simplest thing         → Basic
Lean / Kanban, user stories, story points    → Agile
Scrum ceremonies, PBIs, impediments          → Scrum
Formal, auditable: change requests, risks,
reviews, sign-off                            → CMMI`},
    {h:"Customizing: the inherited process model", p:`You <b>cannot edit</b> the four system processes. To customize, create an <b>inherited process</b> (a child of Basic, Agile, Scrum or CMMI), customize it, then change your project(s) to use it. Changes apply instantly to every project on that process.`,
     lang:"text", code:`Organization settings → Boards → Process
  Agile (system, locked)
   └─ Agile-Contoso (inherited)      ← customize here
        • add custom fields (picklist, integer, identity, …)
        • add custom work item types
        • add custom states (mapped to a state category)
        • add custom rules, change the form layout
        • add custom portfolio backlog levels
        • hide/disable inherited items you don't use
  Project settings → change process to Agile-Contoso`,
     after:`<p>Other models: <b>Hosted XML</b> (organizations migrated from Azure DevOps Server with customized templates) and <b>On-premises XML</b> (Azure DevOps Server). New Azure DevOps Services organizations use the <b>inherited</b> model.</p>`}
  ],
  tip:`Know each process's requirement-level name (<b>Issue / User Story / PBI / Requirement</b>) and the unique types: <b>Impediment</b> = Scrum, <b>Change Request / Risk / Review</b> = CMMI. "Add a field to the Bug form" always starts with <b>create an inherited process</b>, never "edit the Agile process".`,
  exercises:[
    {id:"pr1", type:"match", title:"Which process has this work item type?",
     q:`Match each work item type to the system process it identifies.`,
     choices:["Basic","Agile","Scrum","CMMI"],
     rows:[
       ["User Story","Agile"],
       ["Product Backlog Item","Scrum"],
       ["Requirement","CMMI"],
       ["Impediment","Scrum"],
       ["Change Request","CMMI"],
       ["Issue as the <b>only</b> level between Epic and Task","Basic"]
     ],
     hint:`Each process has its own name for the requirement level. Scrum adds one extra type for blockers; CMMI adds formal types.`,
     why:`Agile uses User Stories, Scrum uses Product Backlog Items and Impediments, CMMI uses Requirements plus Change Requests, Risks and Reviews, and Basic has just Epic → Issue → Task. Note that Agile and CMMI also have an <i>Issue</i> type, but there it's for tracking problems, not the requirement level.`},
    {id:"pr2", type:"mc", title:"Regulated environment",
     q:`A medical-device software team must keep an auditable record of <b>formal change requests, identified risks and design reviews</b> alongside their requirements. Which system process should the new project use?`,
     options:["Basic","Agile","Scrum","CMMI"], answer:3,
     hint:`Which process ships with Change Request, Risk and Review work item types out of the box?`,
     why:`CMMI includes Change Request, Risk, Review and Issue types and a Requirement type with Proposed/Active/Resolved/Closed states, which suits formal, auditable processes. You could add such types to an inherited Agile process, but CMMI gives them to you without customization.`},
    {id:"pr3", type:"order", title:"Scrum backlog hierarchy",
     q:`Order the Scrum work item types from the <b>top</b> of the hierarchy to the <b>bottom</b>.`,
     items:["Epic","Feature","Product Backlog Item","Task"],
     hint:`Two portfolio levels, then the requirement level, then the work the team does inside a sprint.`,
     why:`Scrum: Epic → Feature → Product Backlog Item (and Bug, depending on team settings) → Task. Epics and Features are <b>portfolio backlogs</b>, PBIs live on the <b>product backlog</b>, and Tasks appear on the <b>sprint backlog / taskboard</b>.`},
    {id:"pr4", type:"fill", title:"States and sizing fields",
     q:`Complete the facts about the system processes.`,
     tpl:`A Scrum Product Backlog Item moves New → [[0]] → Committed → Done.<br>
An Agile User Story moves New → [[1]] → Resolved → Closed.<br>
Agile teams size User Stories in [[2]], while Scrum teams size PBIs with the [[3]] field.<br>
Basic work items move To Do → [[4]] → Done.`,
     blanks:[["Approved"],["Active"],["Story Points","StoryPoints","Story Point"],["Effort"],["Doing"]],
     hint:`Scrum approves before committing; Agile items become "active"; Basic uses three plain-English states.`,
     why:`Scrum PBI: New, Approved, Committed, Done (plus Removed). Agile User Story: New, Active, Resolved, Closed (plus Removed). Agile sizes with <b>Story Points</b>, Scrum and Basic with <b>Effort</b>, CMMI with <b>Size</b>. Basic: To Do, Doing, Done.`},
    {id:"pr5", type:"mc", title:"Add a field to Bugs",
     q:`Your Azure DevOps Services project uses the <b>Agile</b> system process. Product owners want a required picklist field <b>Customer Impact</b> on every Bug. What do you do?`,
     options:[
       "Edit the Bug type in the Agile process under Organization settings → Process",
       "Create an inherited process from Agile, add the field to Bug, then change the project to use that process",
       "Export the process template XML, add the field and import it into the Agile process",
       "Create a new project with the CMMI process, because only CMMI supports custom fields"
     ], answer:1,
     hint:`System processes are locked. What model do Azure DevOps Services organizations customize with?`,
     why:`System processes (Basic, Agile, Scrum, CMMI) are read-only. You create an <b>inherited process</b>, add the picklist field and a "required" setting or rule on the Bug type, and switch the project to it. XML import is for the Hosted XML / on-premises models, and every process supports custom fields once inherited.`},
    {id:"pr6", type:"multi", title:"What an inherited process can do",
     q:`Which of these can you do in an <b>inherited</b> process? <i>Select all that apply.</i>`,
     options:[
       "Add a custom field and place it on the work item form",
       "Add a custom work item type such as Customer Request",
       "Add a custom workflow state, e.g. In Review, mapped to a state category",
       "Change the system Scrum process so all projects get the change",
       "Add custom rules, e.g. make a field required when State = Resolved",
       "Upload a modified ProcessTemplate.xml into the inherited process"
     ], answer:[0,1,2,4],
     hint:`Inheritance is configured through the web UI (or REST API), on a copy of a system process.`,
     why:`Inherited processes support custom fields, custom work item types, custom states (each mapped to a category such as Proposed, In Progress, Resolved or Completed), custom rules, layout changes and custom portfolio backlog levels. The system processes themselves stay locked, and XML template uploads belong to the Hosted XML / on-premises XML models.`}
  ]

{
  group:"Azure Boards",
  title:"Backlogs, boards & plans",
  tag:"backlog levels · sprints · columns · WIP · delivery plans",
  intro:`Work items appear in several views. <b>Backlogs</b> are ordered lists for planning, <b>boards</b> visualize flow, <b>sprints</b> (iterations) time-box the work, and <b>Delivery Plans</b> show several teams on one timeline.`,
  sections:[
    {h:"Backlog levels", lang:"text", code:`Portfolio backlogs    Epics → Features       (roll-up, long-term planning)
Product backlog       Stories / PBIs / Requirements / Issues   (+ Bugs, if configured)
Sprint backlog        items assigned to one iteration + their Tasks
                      → Taskboard, Capacity, sprint Burndown`,
     p:`Each team chooses which backlog levels it sees (<b>Team settings → Backlogs</b>), and how bugs are tracked (<b>Working with bugs</b>): <i>managed with requirements</i>, <i>managed with tasks</i>, or <i>not managed on backlogs and boards</i>. Inherited processes can add custom portfolio levels.`},
    {h:"Areas, iterations and teams", lang:"text", code:`Project settings → Boards → Project configuration
  Iterations:  Contoso\\Release 1\\Sprint 1 (dates) …    defined once per project
  Areas:       Contoso\\Web, Contoso\\Mobile …
Team settings → Team configuration
  Iterations:  which sprints this team uses, default + backlog iteration
  Areas:       which area paths belong to this team`},
    {h:"Board columns, WIP limits and more", p:`Each board column maps to a workflow state; several columns can map to the same state (e.g. <i>Develop</i> and <i>Code review</i> both map to <i>Active</i>). Per column you can set:`,
     lang:"text", code:`WIP limit              soft limit: the count turns red when exceeded, moves are NOT blocked
Split column           "Doing" / "Done" sub-columns to show work waiting for the next stage
Definition of done     a checklist shown on the column header
Swimlanes              horizontal lanes, e.g. Expedite vs. Standard
Card fields & styles   extra fields, styling rules, tag colors on cards`},
    {h:"Delivery Plans", p:`A <b>Delivery Plan</b> shows the backlog items of <b>multiple teams</b> laid out on their sprint calendars. It visualizes <b>dependencies</b> (Predecessor/Successor links) as lines between cards and supports <b>markers</b> for key dates. Use it for cross-team roadmaps and spotting dependencies that are scheduled in the wrong order.`}
  ],
  tip:`WIP limits in Azure Boards are <b>advisory</b>: nothing stops you from moving a card. "Visualize work from several teams on a timeline, with dependencies" = <b>Delivery Plans</b>. Sprints are created at <b>project</b> level and then <b>selected per team</b>.`,
  exercises:[
    {id:"bb1", type:"mc", title:"WIP limit exceeded",
     q:`The <i>Code review</i> column on your board has a WIP limit of 3 and already holds 3 cards. A developer drags a fourth card into it. What happens?`,
     options:[
       "The move is blocked until a card leaves the column",
       "The card moves; the column count is shown in red to flag the limit is exceeded",
       "The card moves and an approval request is sent to the team admin",
       "The oldest card in the column is moved back automatically"
     ], answer:1,
     hint:`WIP limits are about making overload <i>visible</i>.`,
     why:`Azure Boards WIP limits are soft limits. The board highlights the exceeded column (the count turns red) but doesn't prevent the move. The team is expected to react, for example by swarming on reviews.`},
    {id:"bb2", type:"match", title:"Pick the right Azure Boards view",
     q:`Match each need to the Azure Boards feature that serves it best.`,
     choices:["Delivery Plans","Board (Kanban)","Taskboard","Capacity planning","Portfolio backlog","Area paths"],
     rows:[
       ["See four teams' features on one calendar, including cross-team dependencies","Delivery Plans"],
       ["Visualize the flow of stories through Develop → Review → Test with WIP limits","Board (Kanban)"],
       ["Track the tasks of the current sprint in To Do / In Progress / Done","Taskboard"],
       ["Check whether planned work fits each person's available hours this sprint","Capacity planning"],
       ["Order Epics and Features and see which stories roll up under them","Portfolio backlog"],
       ["Route work items to the team that owns the mobile app","Area paths"]
     ],
     hint:`Multi-team = plans. Sprint tasks = taskboard. Team ownership of work = areas.`,
     why:`Delivery Plans span teams and time. The Board shows flow and WIP. The Taskboard shows a sprint's tasks. Capacity compares remaining work with each member's available time. Portfolio backlogs manage Epics/Features. Area paths decide which team's backlog a work item lands on.`},
    {id:"bb3", type:"mc", title:"Setting up sprints",
     q:`A new team wants to work in two-week sprints. Sprint 1 to Sprint 6 should appear on <b>their</b> sprint backlog. What are the correct steps?`,
     options:[
       "Create the sprints in Team settings; they are then visible to every team automatically",
       "Define the iterations (with dates) in Project settings → Project configuration, then select them in the team's Team configuration → Iterations",
       "Add a custom field Sprint to the inherited process and set it on each work item",
       "Create one Delivery Plan per sprint"
     ], answer:1,
     hint:`Iterations are a project-wide tree. Teams subscribe to the ones they use.`,
     why:`Iteration paths (with start and end dates) are defined once at project level. Each team then picks which iterations it participates in, plus its default and backlog iteration. Only selected iterations show up under the team's Sprints.`},
    {id:"bb4", type:"multi", title:"Customize the board",
     q:`Which of these are real Azure Boards board customizations? <i>Select all that apply.</i>`,
     options:[
       "Split a column into Doing and Done",
       "Add a Definition of Done checklist to a column",
       "Add swimlanes such as Expedite",
       "Add card styling rules, e.g. color cards with Priority = 1",
       "Configure a WIP limit that hard-blocks moves into the column",
       "Map two different columns to the same workflow state"
     ], answer:[0,1,2,3,5],
     hint:`Only one of these options is wrong, and it's about how strict a WIP limit is.`,
     why:`Split columns, Definition of Done, swimlanes, styling rules and mapping several columns to one state are all supported. WIP limits are soft: they flag, they don't block.`},
    {id:"bb5", type:"mc", title:"Where do bugs show up?",
     q:`A Scrum team wants bugs to be <b>prioritized on the product backlog next to PBIs</b> and estimated with Effort, instead of being hidden or treated as tasks. What do you configure?`,
     options:[
       "Team settings → Working with bugs → Bugs are managed with requirements",
       "Team settings → Working with bugs → Bugs are managed with tasks",
       "Create a custom backlog level named Bugs in an inherited process",
       "Add the tag bug to every PBI"
     ], answer:0,
     hint:`There's a team setting with three choices for bugs.`,
     why:`"Bugs are managed with requirements" puts bugs on the product backlog alongside PBIs/stories, where they are ordered and sized like requirements. "Managed with tasks" puts them on the sprint/taskboard as children of requirements, and the third option keeps them off backlogs and boards entirely.`},
    {id:"bb6", type:"mc", title:"Cross-team dependencies",
     q:`The Web team's feature <i>Checkout v2</i> depends on the API team's feature <i>Payments API</i>. Management wants to see, on a timeline, whether the API feature is scheduled <b>after</b> the feature that needs it. What do you use?`,
     options:[
       "A Predecessor/Successor link between the two features, viewed in a Delivery Plan",
       "A Parent/Child link, viewed on the Taskboard",
       "A shared tag, viewed in a query",
       "A Related link, viewed on the sprint burndown"
     ], answer:0,
     hint:`Delivery Plans draw dependency lines using a specific link type.`,
     why:`Delivery Plans draw a line for each Predecessor/Successor link between cards and flag it when the successor is scheduled before its predecessor. Parent/Child is for hierarchy, not dependencies.`}
  ]
},

{
  group:"GitHub",
  title:"GitHub Issues",
  tag:"templates · forms · labels · milestones · sub-issues",
  intro:`<b>GitHub Issues</b> track bugs, ideas and tasks inside a repository. Good intake (templates and forms) gives you better feedback, and labels, milestones, assignees, issue types and sub-issues give the work structure.`,
  sections:[
    {h:"Where templates live", lang:"text", code:`.github/
├── ISSUE_TEMPLATE/
│   ├── bug_report.yml        issue FORM (YAML, renders as a web form)
│   ├── feature_request.md    issue TEMPLATE (Markdown + YAML front matter)
│   └── config.yml            template chooser settings
├── pull_request_template.md  PR template
└── CODEOWNERS`,
     p:`Templates placed in an organization's <code>.github</code> repository act as defaults for repositories that don't have their own.`},
    {h:"An issue form", file:".github/ISSUE_TEMPLATE/bug_report.yml", code:`name: Bug report                     # required
description: Report something that isn't working   # required
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - octocat
body:                                # required: the form elements
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: Steps to reproduce, expected vs. actual
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      multiple: true
      options:
        - Edge
        - Chrome
        - Firefox
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the Code of Conduct
          required: true`,
     p:`Element types: <code>markdown</code>, <code>input</code>, <code>textarea</code>, <code>dropdown</code>, <code>checkboxes</code>. Every element except markdown needs <code>attributes.label</code>; <code>validations.required</code> makes it mandatory.`},
    {h:"The template chooser", file:".github/ISSUE_TEMPLATE/config.yml", code:`blank_issues_enabled: false          # force people to pick a template
contact_links:
  - name: Ask a question
    url: https://github.com/contoso/app/discussions
    about: Questions go to Discussions, not Issues`},
    {h:"Organizing issues", after:`<div class="tablewrap"><table class="ref">
<tr><th>Feature</th><th>Use it for</th></tr>
<tr><td><b>Labels</b></td><td>Categorize and filter (<code>bug</code>, <code>enhancement</code>, <code>good first issue</code>…); shared by issues and PRs in a repo</td></tr>
<tr><td><b>Milestones</b></td><td>Group issues and PRs toward a target (a release), with an optional due date and a progress bar</td></tr>
<tr><td><b>Assignees</b></td><td>Who owns it; up to 10 people per issue or PR</td></tr>
<tr><td><b>Issue types</b></td><td>Organization-wide classification (e.g. Task, Bug, Feature) set by org admins</td></tr>
<tr><td><b>Sub-issues</b></td><td>Break a large issue into child issues (nested hierarchy) and track completion on the parent</td></tr>
</table></div>`}
  ],
  tip:`Issue <b>forms</b> are <code>.yml</code> files with <code>name</code>, <code>description</code> and <code>body</code>. Markdown templates are <code>.md</code> files with front matter. To stop blank issues, set <code>blank_issues_enabled: false</code> in <code>config.yml</code>. Milestones = release target with progress; labels = categories.`,
  exercises:[
    {id:"gi1", type:"mc", title:"Where does the form go?",
     q:`You want a structured bug report form to appear when people click <b>New issue</b> in the <code>contoso/webshop</code> repository. Where do you save <code>bug_report.yml</code>?`,
     options:[
       "In the repository root",
       "In .github/ISSUE_TEMPLATE/ on the default branch",
       "In .github/workflows/",
       "In docs/ISSUE_TEMPLATES/ on any branch"
     ], answer:1,
     hint:`Same folder as Markdown issue templates and config.yml.`,
     why:`Issue templates and forms are read from <code>.github/ISSUE_TEMPLATE/</code> on the repository's default branch. <code>.github/workflows/</code> is for GitHub Actions.`},
    {id:"gi2", type:"text", lang:"yaml", title:"Write an issue form",
     q:`Write <code>.github/ISSUE_TEMPLATE/bug_report.yml</code>:
      <ul class="tips">
        <li><code>name</code> and <code>description</code> (any text), title prefix <code>[Bug]: </code></li>
        <li>labels <code>bug</code> and <code>triage</code></li>
        <li>a <code>markdown</code> element with an intro text</li>
        <li>a required <code>textarea</code> with id <code>what-happened</code> and a label</li>
        <li>a required <code>dropdown</code> with id <code>severity</code> and options <code>Low</code>, <code>Medium</code>, <code>High</code></li>
        <li>an optional <code>input</code> with id <code>version</code> and a label</li>
      </ul>`,
     starter:`# .github/ISSUE_TEMPLATE/bug_report.yml
`,
     checks:[
       {l:"Top-level name and description", t:a => a.h("name",/\S/) && a.h("description",/\S/)},
       {l:"title starts with [Bug]:", t:a => a.h("title",/^\[Bug\]:/)},
       {l:"labels include bug and triage", t:a => a.h("labels[]","bug") && a.h("labels[]","triage")},
       {l:"body has a markdown element with attributes.value", t:a => a.item("body",{type:"markdown","attributes.value":/\S/})},
       {l:"Required textarea what-happened with a label", t:a => a.item("body",{type:"textarea",id:"what-happened","attributes.label":/\S/,"validations.required":"true"})},
       {l:"Required dropdown severity with a label", t:a => a.item("body",{type:"dropdown",id:"severity","attributes.label":/\S/,"validations.required":"true"})},
       {l:"severity offers Low, Medium and High", t:a => ["Low","Medium","High"].every(o => a.item("body",{id:"severity","attributes.options[]":o}))},
       {l:"input version with a label", t:a => a.item("body",{type:"input",id:"version","attributes.label":/\S/})},
       {l:"version is not required", t:a => !a.item("body",{id:"version","validations.required":"true"})}
     ],
     hint:`<code>body</code> is a list; each element starts with <code>- type: …</code>. <code>id</code>, <code>attributes</code> and <code>validations</code> line up with <code>type</code>. <code>required: true</code> goes under <code>validations</code>, not under <code>attributes</code>.`,
     solution:`name: Bug report
description: Report something that isn't working
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please fill in the details below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: Steps to reproduce, expected and actual result
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low
        - Medium
        - High
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 2.4.1`,
     why:`Issue forms turn free-text reports into structured, validated input, which improves the quality of the feedback loop. Labels from the form are applied automatically, so new bugs land in triage queries and project views without manual work.`},
    {id:"gi3", type:"text", lang:"yaml", title:"Configure the template chooser",
     q:`Write <code>.github/ISSUE_TEMPLATE/config.yml</code> so that:
      <ul class="tips">
        <li>people <b>cannot</b> open blank issues</li>
        <li>a contact link named <code>Security issue</code> points to <code>https://contoso.com/security</code> with an <code>about</code> text</li>
      </ul>`,
     starter:`# .github/ISSUE_TEMPLATE/config.yml
`,
     checks:[
       {l:"blank_issues_enabled: false", t:a => a.h("blank_issues_enabled","false")},
       {l:"contact_links item named Security issue", t:a => a.item("contact_links",{name:/^Security issue$/i})},
       {l:"…with url https://contoso.com/security", t:a => a.item("contact_links",{name:/security/i,url:/^https:\/\/contoso\.com\/security\/?$/i})},
       {l:"…and an about text", t:a => a.item("contact_links",{name:/security/i,about:/\S/})}
     ],
     hint:`Two top-level keys. <code>contact_links</code> is a list of mappings with <code>name</code>, <code>url</code> and <code>about</code>.`,
     solution:`blank_issues_enabled: false
contact_links:
  - name: Security issue
    url: https://contoso.com/security
    about: Please report security vulnerabilities privately, not as public issues.`,
     why:`<code>blank_issues_enabled: false</code> removes the "Open a blank issue" option, so every report goes through a template or form. Contact links send people to the right channel (security reporting, Discussions, support) instead of the issue tracker.`},
    {id:"gi4", type:"lines", title:"Spot the errors in the form",
     q:`This issue form fails validation. Click the <b>two</b> faulty lines.`,
     code:[
       "name: Feature request",
       "description: Suggest an idea for this project",
       "labels: [enhancement]",
       "body:",
       "  - type: text",
       "    id: summary",
       "    attributes:",
       "      label: Summary",
       "      required: true",
       "  - type: textarea",
       "    id: details",
       "    attributes:",
       "      label: Details",
       "    validations:",
       "      required: true"
     ], answer:[4,8],
     hint:`Check the list of valid element types, and where "required" belongs.`,
     why:`There's no <code>text</code> element type: single-line text is <code>type: input</code> (the others are markdown, textarea, dropdown, checkboxes). And <code>required: true</code> belongs under <code>validations:</code>, not under <code>attributes:</code>, as the textarea element shows. (Inside <code>checkboxes</code> options, <code>required</code> is set per option, which is a different case.)`},
    {id:"gi5", type:"match", title:"Labels, milestones, sub-issues…",
     q:`Match each need to the GitHub Issues feature that fits it.`,
     choices:["Labels","Milestone","Sub-issues","Assignees","Issue types","Issue form"],
     rows:[
       ["Track all issues and PRs planned for v3.0, with a due date and percent complete","Milestone"],
       ["Mark issues as good first issue or needs-triage for filtering","Labels"],
       ["Split the epic-sized issue \"New checkout\" into child issues and see progress on the parent","Sub-issues"],
       ["Make it clear that Priya and Tom own the fix","Assignees"],
       ["Classify every issue in the organization as Bug, Feature or Task consistently","Issue types"],
       ["Force bug reporters to fill in reproduction steps","Issue form"]
     ],
     hint:`One of these is defined at organization level, one is about a release target with a date.`,
     why:`Milestones group issues and PRs toward a dated target and show progress. Labels are free-form categories. Sub-issues build a parent/child hierarchy with progress tracking. Assignees name the owners. Issue types are an organization-wide classification. Issue forms with <code>validations.required</code> enforce input.`},
    {id:"gi6", type:"mc", title:"Breaking down big work",
     q:`A maintainer has an issue "Redesign onboarding" that's too big for one PR. She wants each piece to be its own issue that can be assigned and closed separately, while the original issue shows how many pieces are done. What should she use?`,
     options:[
       "Add a label onboarding to every related issue",
       "Create sub-issues under the original issue",
       "Put the pieces in the issue body as plain bullet points",
       "Create a milestone called Redesign onboarding and close the original issue"
     ], answer:1,
     hint:`You need a real parent/child relationship between issues.`,
     why:`Sub-issues create a parent/child hierarchy between issues. Each child is a full issue (assignees, labels, its own PRs), and the parent shows sub-issue progress, which GitHub Projects can also display as a field. A label or milestone groups issues but doesn't express hierarchy.`}
  ]
},

{
  group:"GitHub",
  title:"GitHub Projects",
  tag:"views · custom fields · built-in workflows",
  intro:`<b>GitHub Projects</b> is a flexible planning tool that sits <b>on top of issues and pull requests</b> from one or more repositories. A project belongs to a user or an organization, and it can hold draft items that aren't issues yet.`,
  sections:[
    {h:"Views and layouts", after:`<div class="tablewrap"><table class="ref">
<tr><th>Layout</th><th>Shows</th><th>Typical options</th></tr>
<tr><td><b>Table</b></td><td>Spreadsheet of items and fields</td><td>Group by, sort, filter, slice by, field sums</td></tr>
<tr><td><b>Board</b></td><td>Cards in columns (by Status or another single-select / iteration field)</td><td>Column limits, group by, sort, filter</td></tr>
<tr><td><b>Roadmap</b></td><td>Items on a timeline</td><td>Needs <b>date</b> or <b>iteration</b> fields for start/target; zoom levels, markers</td></tr>
</table></div>
<p>Every view saves its own layout, filter, grouping and sorting, so different audiences can share one project (e.g. "Current sprint" board, "Bugs by priority" table, "Q3 roadmap").</p>`},
    {h:"Fields", lang:"text", code:`Built-in   Title · Assignees · Status · Labels · Milestone · Repository
           Linked pull requests · Reviewers · Parent issue · Sub-issue progress · Type
Custom     Text           free text            e.g. Customer
           Number         numeric (sums!)      e.g. Estimate
           Date           a date               e.g. Target date
           Single select  one of a list        e.g. Priority: P0 / P1 / P2
           Iteration      time-boxed cycles    e.g. Sprint (2 weeks, with breaks)`},
    {h:"Built-in workflows (automation)", lang:"text", code:`Item added to project     → set Status (e.g. Todo)
Item reopened             → set Status
Item closed               → set Status to Done        (on by default)
Pull request merged       → set Status to Done        (on by default)
Code changes requested / Code review approved → set Status
Auto-close issue          → close the issue when Status is set to Done
Auto-add to project       → add new matching items from a repo, e.g. is:issue label:bug
Auto-archive items        → archive items matching a filter, e.g. is:closed updated:<@today-2w`,
     p:`For anything beyond that, use <b>GitHub Actions</b> with the <b>GraphQL API</b> (ProjectV2) or the <code>actions/add-to-project</code> action. Projects also have <b>Insights</b> charts and <b>status updates</b>.`}
  ],
  tip:`Sprint planning in Projects = an <b>Iteration</b> field. Timeline = <b>Roadmap</b> layout (needs date/iteration fields). "Automatically set Done when the PR merges" = the <b>Pull request merged</b> built-in workflow. "Add every new bug from repo X automatically" = <b>Auto-add to project</b> with a filter.`,

Priority with values P0, P1, P2 → [[1]]<br>
Estimate in points that should be summed per group → [[2]]<br>
Launch date → [[3]]<br>
Customer name (free text) → [[4]]`,

    {id:"gp3", type:"multi", title:"Built-in workflows",
     q:`Which of these are <b>built-in workflows</b> in GitHub Projects (configured under the project's Workflows menu, no Actions needed)? <i>Select all that apply.</i>`,

{
  group:"Feedback",
  title:"Feedback cycles & notifications",
  tag:"subscriptions · watching · mentions · stakeholders",
  intro:`A fast <b>feedback cycle</b> means the right people hear about the right events quickly: a failed build, a review request, a new bug from a customer. Too few notifications hide problems; too many get ignored. Both Azure DevOps and GitHub let you tune this per person and per team.`,
  sections:[
    {h:"Azure DevOps notification subscriptions", lang:"text", code:`Personal      User settings → Notifications   (your own subscriptions; opt out of defaults)
Team          Team settings → Notifications   (deliver to team members, a custom email
                                               address / distribution list, …)
Project       Project settings → Notifications
Organization  Organization settings → Notifications  (default subscriptions, delivery settings)

A subscription = event (work item changed, build completes, PR created, deployment
approval pending, …) + filter criteria (area path, field values, branch …) + delivery`,
     p:`Other feedback paths in Azure DevOps: <b>Follow</b> a work item or PR to get updates, <b>@mention</b> someone in a discussion, and <b>service hooks</b> to push events to Teams, Slack or a webhook.`},
    {h:"Mentions", lang:"text", code:`Azure DevOps (work item discussion, PR comments)
  @Priya Sharma      notifies the person
  #1234              links work item 1234
  !87                links pull request 87

GitHub (issues, PRs, discussions, commits)
  @octocat           notifies the user
  @contoso/web-team  notifies the team (org teams)
  #42                references issue/PR 42 in this repo
  contoso/api#7      references an issue in another repo`},
    {h:"GitHub watching and notifications", lang:"text", code:`Watch a repository:
  Participating and @mentions   (default) only threads you take part in
  All Activity                  every issue, PR, release, discussion
  Ignore                        nothing, not even @mentions
  Custom                        pick: Issues · Pull requests · Releases · Discussions · Security alerts

You're "participating" when you: are @mentioned (or your team is), are assigned,
are requested for review, opened the thread, or commented on it.
Delivery: web inbox (github.com/notifications), email, GitHub Mobile.`,
     p:`<b>CODEOWNERS</b> closes another feedback loop: when a PR touches files you own, you are <b>automatically requested for review</b>, and with branch protection you can require code-owner approval.`},
    {h:"Stakeholder feedback", p:`Bring business users into the loop without paid licenses: Azure DevOps <b>Stakeholder</b> access is free and lets people view and add work items and use boards (but not code). On GitHub, use <b>issue forms</b> for structured reports and <b>Discussions</b> for open-ended questions and ideas, keeping the issue tracker for actionable work. Demo working software every sprint and capture the feedback as new backlog items.`}
  ],
  tip:`"Notify the whole team when a build on main fails" = a <b>team</b> subscription with a branch filter, not N personal ones. "Business users must add and view work items for free" = <b>Stakeholder</b> access. In GitHub, <b>Ignore</b> suppresses even @mentions; <b>Custom</b> is how you watch only releases or security alerts.`,
  exercises:[
    {id:"fb1", type:"match", title:"GitHub watch settings",
     q:`Match each wish to the repository <b>Watch</b> setting that achieves it.`,
     choices:["Participating and @mentions","All Activity","Ignore","Custom"],
     rows:[
       ["Hear about every new issue, PR and comment in the repo","All Activity"],
       ["Only hear about threads I comment on, am assigned to or am @mentioned in","Participating and @mentions"],
       ["Only get notified when a new release is published (plus my own threads)","Custom"],
       ["Stop all notifications from this repo, including @mentions","Ignore"]
     ],
     hint:`One of these is the default; one lets you pick event types.`,
     why:`Participating and @mentions is the default. All Activity follows everything. Custom adds selected event types (Issues, Pull requests, Releases, Discussions, Security alerts) on top of participating. Ignore silences the repo completely, @mentions included.`},
    {id:"fb2", type:"multi", title:"When are you participating?",
     q:`You watch a repo with the default setting. Which events will notify you? <i>Select all that apply.</i>`,
     options:[
       "Someone writes @you in a comment on an issue",
       "You're assigned to an issue",
       "Someone requests your review on a pull request",
       "Someone mentions @contoso/web-team, a team you belong to",
       "Someone stars the repository",
       "Someone opens an issue you have never interacted with"
     ], answer:[0,1,2,3],
     hint:`Default = Participating and @mentions. Stars never notify.`,
     why:`Direct mentions, team mentions, assignment and review requests all make you a participant. Stars don't generate notifications, and a brand-new issue you're not involved in only notifies people watching All Activity (or Custom → Issues).`},
    {id:"fb3", type:"mc", title:"Failed builds on main",
     q:`In Azure DevOps, every member of the <b>Web</b> team, and the distribution list <code>web-oncall@contoso.com</code>, must get an email when a build of the <code>main</code> branch fails. Members joining the team later should be included automatically. What do you configure?`,
     options:[
       "A personal subscription for each team member",
       "A team subscription in the Web team's notification settings for Build completes, filtered on status Failed and branch main, delivered to team members and the custom address",
       "A service hook to Microsoft Teams",
       "A branch policy on main with Notify on failure enabled"
     ], answer:1,
     hint:`Who owns the subscription determines who receives it as the team changes.`,
     why:`A <b>team subscription</b> follows team membership automatically and can also deliver to a custom email address such as a distribution list. Personal subscriptions don't scale, a service hook posts to a channel rather than emailing people, and branch policies don't send build-failure notifications.`},
    {id:"fb4", type:"fill", title:"Mention syntax in Azure DevOps", mono:true,
     q:`Complete this Azure DevOps work item comment so that it notifies Priya, links work item 2048 and links pull request 311.`,
     tpl:`[[0]]Priya Sharma can you check whether [[1]]2048 is fixed by [[2]]311?`,
     blanks:[["@"],["#"],["!"]],
     hint:`Person, work item, pull request: three different single characters.`,
     why:`In Azure DevOps discussions and PR comments, <code>@</code> mentions a person (and emails them), <code>#ID</code> links a work item, and <code>!ID</code> links a pull request.`},
    {id:"fb5", type:"mc", title:"Feedback from the business",
     q:`Ten people from Marketing need to <b>view the board, add feature requests as work items and comment on them</b> in a private Azure DevOps project. They never touch code. The company doesn't want to buy Basic licenses for them. Which access level do you assign?`,
     options:["Basic","Basic + Test Plans","Stakeholder","Visual Studio Subscriber"], answer:2,
     hint:`There's a free access level designed for exactly this.`,
     why:`<b>Stakeholder</b> access is free and lets users view and work with work items and boards, which is enough to give feedback and add requests, but not access to repos, so it fits non-technical contributors. Basic is a paid license for developers.`},
    {id:"fb6", type:"text", lang:"text", title:"Route reviews with CODEOWNERS",
     q:`Write <code>.github/CODEOWNERS</code> so that:
      <ul class="tips">
        <li><code>@contoso/core</code> owns everything by default</li>
        <li><code>@contoso/docs</code> owns everything under <code>/docs/</code></li>
        <li>every <code>*.tf</code> file is owned by <b>both</b> <code>@contoso/platform</code> and <code>@maria</code></li>
      </ul>
      Remember: when several patterns match, the <b>last matching line wins</b>.`,
     starter:`# .github/CODEOWNERS
`,
     checks:[
       {l:"A default line: * @contoso/core", t:a => a.lines.some(l => /^\*\s+@contoso\/core\s*$/.test(l))},
       {l:"/docs/ owned by @contoso/docs", t:a => a.lines.some(l => /^\/?docs\/(\*\*)?\s+@contoso\/docs\s*$/.test(l))},
       {l:"*.tf owned by @contoso/platform and @maria", t:a => a.lines.some(l => /^(\*\*\/)?\*\.tf\s+/.test(l) && /\s@contoso\/platform(\s|$)/.test(l) && /\s@maria(\s|$)/.test(l))},
       {l:"The * default comes first (otherwise it overrides everything)", t:a => { const i = a.lines.findIndex(l => /^\*\s/.test(l)); return i >= 0 && a.lines.every((l, k) => k <= i || !/^\*\s/.test(l)) && a.lines.slice(0, i).every(l => !/@/.test(l)); }}
     ],
     hint:`One rule per line: <code>pattern owner1 owner2</code>. Put the catch-all <code>*</code> at the top so the more specific rules below it win.`,
     solution:`# Default owners for everything
*        @contoso/core

# Documentation
/docs/   @contoso/docs

# Terraform files anywhere in the repo
*.tf     @contoso/platform @maria`,
     why:`CODEOWNERS uses gitignore-style patterns and the <b>last</b> matching pattern takes precedence, so the catch-all goes first. Code owners are automatically requested for review when a PR touches their files, and the branch protection setting "Require review from Code Owners" turns that into a required approval.`}
  ]
},

{
  group:"Traceability",
  title:"Linking work to code",
  tag:"AB# · closing keywords · branches · PRs",
  intro:`Traceability starts with linking: every branch, commit and pull request should point at the work item or issue it implements. Both platforms can create these links <b>from text you type anyway</b>, such as commit messages and PR descriptions.`,
  sections:[
    {h:"GitHub issues: closing keywords", lang:"text", code:`close  closes  closed
fix    fixes   fixed
resolve resolves resolved

Closes #42                      issue in the same repo
Fixes contoso/api#7             issue in another repo
Closes #15, closes #18          one keyword PER issue
Related to #20                  just a reference, does not close`,
     p:`Put the keyword in the <b>pull request description</b> (or in a commit message). The issue closes when the PR is merged <b>into the default branch</b>. A PR into any other branch only creates a reference. You can also link a PR to an issue manually from the <b>Development</b> section of either one, and create a branch for an issue from there.`},
    {h:"GitHub repos + Azure Boards: AB#", lang:"text", code:`Prerequisite: install the Azure Boards app for GitHub and connect the repo
              to the Azure DevOps project (Project settings → GitHub connections)

AB#1234            in a commit message, PR title or PR description → link
Fixes AB#1234      also moves the work item to Done (its "Completed" state)
                   when the pull request is merged`,
     p:`The links show up in the work item's <b>Development</b> section as GitHub commits and GitHub pull requests. You can also add them by hand with <b>Add link</b>. Without the connection, <code>AB#1234</code> is just text.`},
    {h:"Azure Repos + Azure Boards", lang:"text", code:`Work item → Development → Create branch          branch is linked automatically
Commit message "#1234"                            linked (repo setting: Commit mention linking)
Commit message "Fixes #1234"                      can complete it on merge to the default
                                                  branch (Commit mention work item resolution)
PR → Work items panel                             link items to the PR
Branch policy: Check for linked work items        Required = no PR without a linked item
Complete PR: Complete associated work items       transition linked items on merge`}
  ],
  tip:`GitHub ↔ Azure Boards = <b>AB#ID</b>, and only after the <b>Azure Boards app</b> connects the repo. Closing GitHub issues = <b>close/fix/resolve</b> keywords, and only for PRs into the <b>default branch</b>. "Every PR in Azure Repos must reference a work item" = branch policy <b>Check for linked work items: Required</b>.`,
  exercises:[
    {id:"lk1", type:"text", lang:"text", title:"Commit message with AB#",
     q:`Your code is in GitHub and the repo is connected to Azure Boards. Write a commit message for a fix to the cart total rounding that <b>links to work item 412</b> and <b>moves it to Done</b> when the pull request merges. Use a summary line plus the link.`,
     starter:``,
     checks:[
       {l:"Has a summary line describing the change", t:a => a.lines.length > 0 && /[a-z]{3,}/i.test(a.lines[0].replace(/\b\w+\s+AB#\d+/gi, ""))},
       {l:"Uses a state-changing keyword: Fix / Fixes / Fixed AB#412", t:a => /\bfix(e[sd])?:?\s+AB#412\b/i.test(a.src)},
       {l:"Every #412 is written as AB#412 (a bare #412 would mean a GitHub issue)", t:a => !/(^|[^B])#412\b/i.test(a.src.replace(/AB#412/gi, ""))}
     ],
     hint:`Format: <code>Fixes AB#412</code>. Without <code>AB</code> in front, GitHub reads <code>#412</code> as an issue in the repo.`,
     solution:`Round cart totals to two decimals before tax

Fixes AB#412`,
     why:`<code>AB#412</code> creates the GitHub commit link on work item 412. Prefixing it with <code>fix</code>, <code>fixes</code> or <code>fixed</code> also transitions the work item to its done state when the PR merges. A plain <code>#412</code> is a GitHub issue reference and does nothing in Azure Boards.`},
    {id:"lk2", type:"text", lang:"text", title:"PR description that closes issues",
     q:`Write a pull request description (the PR targets <code>main</code>, the default branch) that:
      <ul class="tips">
        <li><b>closes</b> issues <code>#15</code> and <code>#18</code> when merged</li>
        <li><b>mentions</b> issue <code>#20</code> without closing it</li>
      </ul>`,
     starter:``,
     checks:[
       {l:"#15 is preceded by a closing keyword", t:a => new RegExp("\\b" + KW + ":?\\s+#15\\b", "i").test(a.src)},
       {l:"#18 is preceded by its own closing keyword", t:a => new RegExp("\\b" + KW + ":?\\s+#18\\b", "i").test(a.src)},
       {l:"#20 is mentioned", t:a => /#20\b/.test(a.src)},
       {l:"#20 is NOT preceded by a closing keyword", t:a => !new RegExp("\\b" + KW + ":?\\s+#20\\b", "i").test(a.src)}
     ],
     hint:`Each issue you want closed needs its own keyword: <code>Closes #15, closes #18</code>. <code>Closes #15, #18</code> only closes #15.`,
     solution:`Adds input validation to the signup form.

Closes #15, closes #18
Related to #20 (follow-up for the mobile app)`,
     why:`A closing keyword applies only to the issue reference directly after it, so each issue needs its own keyword. Any other mention (<code>Related to #20</code>, <code>see #20</code>) creates a cross-reference in the issue's timeline without closing it.`},
    {id:"lk3", type:"mc", title:"Why is the issue still open?",
     q:`A PR description says <code>Fixes #22</code>. The PR was approved and merged into <code>develop</code>. The repository's default branch is <code>main</code>. Issue #22 is still open. Why?`,
     options:[
       "Fixes is not a valid closing keyword; only Closes works",
       "Closing keywords only take effect when the PR is merged into the default branch",
       "The issue must be assigned to the PR author first",
       "Closing keywords only work in commit messages, not in PR descriptions"
     ], answer:1,
     hint:`Check which branch the PR went into.`,
     why:`Issues are closed automatically only when the linked PR is merged into the repository's <b>default</b> branch. It closes once <code>develop</code> is merged into <code>main</code> through a PR that carries the keyword, or you can close it by hand. <code>fix</code>/<code>fixes</code>/<code>fixed</code> are valid keywords, and they work in PR descriptions and commit messages.`},
    {id:"lk4", type:"lines", title:"Which commits won't link?", prose:true,
     q:`The GitHub repo is connected to Azure Boards. Click <b>every</b> commit message that will <b>not</b> link to Azure Boards work item 77.`,
     code:[
       "Add retry policy to payment client AB#77",
       "Fix null check in basket (AB 77)",
       "Fixes AB#77: handle empty cart",
       "Refactor logging #77",
       "Update docs, see AB#77 and AB#80",
       "Bump package version AB-77"
     ], answer:[1,3,5],
     hint:`Only one exact syntax creates the link: <code>AB#</code> followed by the ID.`,
     why:`Only <code>AB#77</code> is recognized. <code>AB 77</code> and <code>AB-77</code> are plain text, and <code>#77</code> refers to GitHub issue 77 in the same repo. One message can link several work items (<code>AB#77 and AB#80</code>).`},
    {id:"lk5", type:"mc", title:"No PR without a work item",
     q:`Auditors require that every change merged into <code>main</code> in your <b>Azure Repos</b> repository can be traced to a work item. How do you enforce this?`,
     options:[
       "Enable the branch policy Check for linked work items on main and set it to Required",
       "Add a pipeline step that fails if the commit message has no #",
       "Enable Commit mention linking in the repository settings",
       "Create a team notification subscription for pull requests without work items"
     ], answer:0,
     hint:`Look for the option that actually blocks the merge.`,
     why:`The <b>Check for linked work items</b> branch policy set to <b>Required</b> blocks PR completion until at least one work item is linked. Commit mention linking only creates links when people remember to type them, and a notification doesn't block anything.`},
    {id:"lk6", type:"match", title:"How does the link get there?",
     q:`Match each situation to the mechanism that creates the link (or closes the item).`,
     choices:["AB#ID mention","Closing keyword (Closes #ID)","Create branch from the work item","Commit mention #ID in Azure Repos","Complete associated work items on PR completion"],
     rows:[
       ["Link a GitHub pull request to Azure Boards work item 950","AB#ID mention"],
       ["Close GitHub issue 31 when the PR merges into main","Closing keyword (Closes #ID)"],
       ["Start work on story 1200 in Azure Repos with the branch already linked","Create branch from the work item"],
       ["Link an Azure Repos commit to work item 88 from the commit message","Commit mention #ID in Azure Repos"],
       ["Move the Azure Repos PR's linked stories to Closed when it's merged","Complete associated work items on PR completion"]
     ],
     hint:`GitHub → Azure Boards needs a prefix. GitHub issues use keywords. Azure Repos uses plain #ID and the PR completion dialog.`,
     why:`<code>AB#ID</code> links GitHub commits/PRs to Azure Boards. Closing keywords close GitHub issues. The Development section of a work item can create an already-linked branch. In Azure Repos, <code>#ID</code> in a commit message links (when Commit mention linking is on), and the PR completion option transitions linked work items.`},
    {id:"lk7", type:"mc", title:"The missing link",
     q:`Developers put <code>AB#1500</code> in commit messages on a GitHub repository, but nothing appears in the work item's Development section. Other repos in the same GitHub organization link fine. What's the most likely cause?`,
     options:[
       "The repository isn't connected to the Azure DevOps project through the Azure Boards app",
       "AB# only works in PR titles, not commit messages",
       "Work item 1500 must be in the Active state first",
       "The commits must be signed"
     ], answer:0,
     hint:`AB# is processed by an integration that is configured per repository.`,
     why:`The Azure Boards app must have access to the repository <b>and</b> the repo must be added to the project's GitHub connection. Only then are <code>AB#</code> mentions in commits, PR titles and PR descriptions turned into links.`}
  ]
},

{
  group:"Traceability",
  title:"End-to-end traceability",
  tag:"requirement → commit → build → test → release",
  intro:`Traceability answers two questions in both directions. <b>Forward:</b> "Where is this requirement? Is it built, tested and released?" <b>Backward:</b> "This production bug came from which change, which build, which requirement?" The links you created in the previous module are the chain.`,

    {h:"The chain in Azure DevOps", lang:"text", code:`Epic → Feature → User Story           Parent/Child links

  └ Branch · Commit · Pull Request    Development links  (AB#, #ID, Create branch, PR panel)
      └ Build / pipeline run          "Integrated in build"; run shows linked work items
          └ Test results              linked to test cases / requirements
              └ Release / deployment  Deployment control on the work item form
Bug                                   "Found in build", Related to the story, created from a failed test`},
    {h:"Useful link types", after:`<div class="tablewrap"><table class="ref">
<tr><th>Link type</th><th>Meaning</th></tr>
<tr><td>Parent / Child</td><td>Hierarchy (Feature → Story → Task)</td></tr>
<tr><td>Predecessor / Successor</td><td>Dependency (shown in Delivery Plans)</td></tr>
<tr><td>Related</td><td>Loose association</td></tr>
<tr><td>Duplicate / Duplicate Of</td><td>Same work reported twice</td></tr>
<tr><td>Tested By / Tests</td><td>Requirement ↔ Test Case</td></tr>
<tr><td>Found in build / Integrated in build</td><td>Bug found in a build / work included in a build</td></tr>
<tr><td>Branch, Commit, Pull Request, GitHub Commit, GitHub Pull Request</td><td>Development links to code</td></tr>
</table></div>`},
    {h:"Quality traceability", p:`Add test cases to <b>requirement-based suites</b> in Azure Test Plans: they get <i>Tested By</i> links automatically. Automated test results from pipelines can be linked to requirements, and the <b>Requirements quality</b> dashboard widget shows pass/fail per requirement. From a failed test in a pipeline run's <b>Tests</b> tab you can create a <b>Bug</b> that carries the build and test details. Pipelines can link the work items of the commits in each run (the pipeline setting <i>Automatically link work items included in this run</i>), and the work item form's <b>Deployment</b> control shows which environments the work has reached.`},

      └ Commits → Pull request "Closes #42"   review, required checks (Actions)
          └ Workflow run for the merge commit (SHA, logs, artifacts)
              └ Deployment to an environment   (deployment history per environment)

  ],
  tip:`"Which requirements have passing tests?" = test cases linked to requirements + <b>Requirements quality</b> widget / requirement-based suites. "Create a bug from a failed automated test with build info" = the run's <b>Tests</b> tab → create bug. "Every change must trace to a requirement" = <b>required linked work items</b> policy + consistent AB#/#ID linking.`,
